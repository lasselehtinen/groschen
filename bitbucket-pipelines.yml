image:
  name: serversideup/php:8.5.12-cli-v5.0.5
  run-as-user: 0

clone:
  depth: 1

definitions:
  caches:
    composer-files: /composer/cache
  steps:
    - step: &install
        name: Install dependencies
        runs-on: self.hosted
        caches:
          - composer-files
        artifacts:
          - .env
          - vendor/**
        script:
          - echo $ENV | base64 --decode --ignore-garbage > .env
          - composer install --prefer-dist --no-interaction --no-progress

    - step: &security-check
        name: Run security checks
        runs-on: self.hosted
        script:
          - apt-get -qq update && apt-get -qq -y install --no-install-recommends git
          - vendor/bin/grumphp run --testsuite=security

    - step: &syntax-check
        name: Run syntax and style checks
        runs-on: self.hosted
        script:
          - apt-get -qq update && apt-get -qq -y install --no-install-recommends git
          - vendor/bin/grumphp run --testsuite=syntax
          - vendor/bin/pint --test

    - step: &static-analysis
        name: Run static analysis
        runs-on: self.hosted
        script:
          - apt-get -qq update && apt-get -qq -y install --no-install-recommends git
          - export PHP_MEMORY_LIMIT=1024M
          - vendor/bin/grumphp run --testsuite=static

    - step: &unit-tests
        name: Run unit tests
        runs-on: self.hosted
        script:
          - echo $BOOKS_CA_CERT | base64 --decode --ignore-garbage > /usr/local/share/ca-certificates/booksca.books.local_BooksCA_2025.crt
          - update-ca-certificates
          - vendor/bin/phpunit --log-junit ./test-reports/junit.xml

pipelines:
  default:
    - step: *install
    - parallel:
        - step: *security-check
        - step: *syntax-check
        - step: *static-analysis
        - step: *unit-tests
  custom:
      security-check:
        - step: *install
        - step: *security-check
